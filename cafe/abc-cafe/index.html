<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ABC CAFE | 09ZERO Smart QR</title>

  <meta
    name="description"
    content="ABC CAFE digital menu powered by 09ZERO Smart QR."
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <link
    rel="stylesheet"
    href="../../style.css"
  >
</head>

<body>

  <main class="cafe-page">

    <header class="hero">

      <div class="logo">
        09ZERO
      </div>

      <p class="powered">
        POWERED BY 09ZERO
      </p>

      <h1 id="cafeName">
        ABC CAFE
      </h1>

      <p
        class="cafe-address"
        id="cafeAddress"
      >
        Chhatarpur, Madhya Pradesh
      </p>

    </header>


    <section class="menu-section">

      <button
        class="main-btn"
        id="menuBtn"
      >
        🍔 VIEW MENU
      </button>

    </section>


    <section class="review-section">

      <button
        class="action-btn"
        id="reviewBtn"
      >
        ⭐ GOOGLE REVIEW
      </button>

    </section>


    <section class="social-section">

      <a
        href="#"
        id="instagramBtn"
        class="social-btn"
      >
        📸 Instagram
      </a>

      <a
        href="#"
        id="facebookBtn"
        class="social-btn"
      >
        👍 Facebook
      </a>

    </section>


    <section class="contact-section">

      <a
        href="#"
        id="whatsappBtn"
        class="contact-btn whatsapp-btn"
      >
        💬 ORDER ON WHATSAPP
      </a>

    </section>


    <footer>

      <div class="footer-logo">
        09ZERO
      </div>

      <p>
        Smart QR for modern businesses
      </p>

      <small>
        © 2026 09ZERO. All rights reserved.
      </small>

    </footer>

  </main>


  <div
    class="modal"
    id="menuModal"
  >

    <div class="modal-box">

      <button
        class="close-btn"
        id="closeMenu"
        aria-label="Close menu"
      >
        ×
      </button>

      <h2>
        🍔 DIGITAL MENU
      </h2>

      <div id="menuContainer"></div>

    </div>

  </div>


  <script src="../../script.js"></script>

</body>

</html>
